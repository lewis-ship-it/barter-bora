<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barter Bora | Better Trading</title>
    
    <!-- Tailwind for rapid layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Your Modular CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bora-dark">

    <div class="welcome-gradient min-h-screen text-white flex flex-col items-center px-6">
        
        <!-- Header Section -->
        <header class="mt-20 mb-10 text-center">
            <h1 class="brand-title">BARTER BORA</h1>
            <p class="brand-subtitle">Better Trading. Zero Cash.</p>
        </header>

        <!-- The Mat (Card) -->
        <main class="welcome-card">
            <h2 class="section-title">How it works:</h2>
            
            <div class="steps-container">
                <div class="step">
                    <span class="step-num">01.</span>
                    <p class="step-text">
                        <span class="highlight">List:</span> Post items you don't need (like 100 chairs).
                    </p>
                </div>

                <div class="step">
                    <span class="step-num">02.</span>
                    <p class="step-text">
                        <span class="highlight">Find:</span> Browse for things you actually want.
                    </p>
                </div>

                <div class="step">
                    <span class="step-num">03.</span>
                    <p class="step-text">
                        <span class="highlight">Swap:</span> Make a bid. No money ever changes hands.
                    </p>
                </div>
            </div>

            <!-- Call to Action -->
            <button class="cta-button">
                START SWAPPING
            </button>
        </main>

        <!-- Modular Ad Slot -->
        <footer class="mt-auto mb-8 ad-slot">
            <p class="ad-text">Ad Space Available</p>
        </footer>
    </div>

</body>
</html>
