<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barter Bora | Better Trading</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind for rapid layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen px-4 py-12">

    <!-- Header Section -->
    <header class="text-center mb-12">
        <h1 class="brand-title">BARTER BORA</h1>
        <p class="brand-subtitle">Better Trading. Zero Cash.</p>
    </header>

    <!-- The Mat (Card) -->
    <main class="welcome-card">
        <h2 class="section-title">How It Works</h2>
        
        <div class="steps-container">
            <div class="step">
                <span class="step-num">01</span>
                <p class="step-text">
                    <span class="highlight">List:</span> Post items you don't need (like 100 chairs).
                </p>
            </div>

            <div class="step">
                <span class="step-num">02</span>
                <p class="step-text">
                    <span class="highlight">Find:</span> Browse for things you actually want.
                </p>
            </div>

            <div class="step">
                <span class="step-num">03</span>
                <p class="step-text">
                    <span class="highlight">Swap:</span> Make a bid. No money ever changes hands.
                </p>
            </div>
        </div>

        <!-- Call to Action -->
        <a href="auth.html" class="cta-button">START SWAPPING</a>
    </main>

    <!-- Modular Ad Slot -->
    <footer class="mt-16 ad-slot">
        <p class="ad-text">Ad Space Available</p>
    </footer>

</body>
</html>
