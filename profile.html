    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let authToken = localStorage.getItem('bora_token');
        let currentUser = JSON.parse(localStorage.getItem('user_data') || '{}');
        let supabase;

        const SUPABASE_URL = import.meta?.env?.VITE_SUPABASE_URL || 'https://ywbaqtegpjiwsarbkszr.supabase.co';
        const SUPABASE_ANON_KEY = import.meta?.env?.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3YmFxdGVncGppd3NhcmJrc3pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjE0MjE1MTksImV4cCI6MjAzNjk5NzUxOX0.2BP9dUJ1g2sGp0N7QzLmQkLm2X2X2X2X2X2X2X2X2X';

        document.addEventListener('DOMContentLoaded', function() {
            if (!authToken) {
                window.location.href = 'auth.html';
                return;
            }

            if (window.supabase && window.supabase.createClient) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }

            loadProfile();
        });

        async function loadProfile() {
            try {
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) throw error;

                document.getElementById('profile-name').textContent = `${profile.first_name} ${profile.last_name}`;
                document.getElementById('profile-username').textContent = `@${profile.username}`;
                document.getElementById('profile-email').textContent = profile.email;
                document.getElementById('profile-phone').textContent = profile.phone_number || 'Not provided';
                document.getElementById('profile-location').textContent = profile.location || 'Not provided';
                document.getElementById('profile-date').textContent = formatDate(profile.created_at);

                document.getElementById('edit-phone').value = profile.phone_number || '';
                document.getElementById('edit-location').value = profile.location || '';

            } catch (error) {
                console.error('Error loading profile:', error);
                alert('Error loading profile: ' + error.message);
            }
        }

        function toggleEditMode() {
            const editForm = document.getElementById('edit-form');
            editForm.classList.toggle('hidden');
        }

        async function handleProfileUpdate(event) {
            event.preventDefault();

            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({
                        phone_number: document.getElementById('edit-phone').value || null,
                        location: document.getElementById('edit-location').value || null
                    })
                    .eq('id', currentUser.id);

                if (error) throw error;

                alert('Profile updated successfully!');
                toggleEditMode();
                loadProfile();

            } catch (error) {
                console.error('Error updating profile:', error);
                alert('Error: ' + error.message);
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function handleLogout() {
            localStorage.removeItem('bora_token');
            localStorage.removeItem('user_data');
            window.location.href = 'index.html';
        }
    </script>
